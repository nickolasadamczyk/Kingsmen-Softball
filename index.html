<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Kingsmen Softball</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="brand-logo" />
      <div>
        <h1 id="teamName">Kingsmen Softball</h1>
        <p id="teamTagline" class="tagline">Slow-Pitch Team Manager</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings &amp; Backup" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="roster">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16.5 5.3a3 3 0 0 1 0 5.4"/><path d="M18 20a6 6 0 0 0-3.2-5.3"/></svg></span><span>Roster</span>
    </button>
    <button class="tab" data-tab="coaches">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M14.5 8.5a4 4 0 0 1 0 7"/><path d="M17.5 5.5a8 8 0 0 1 0 13"/></svg></span><span>Coaches</span>
    </button>
    <button class="tab" data-tab="checkin">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="m9 13 2 2 4-4"/></svg></span><span>Check-In</span>
    </button>
    <button class="tab" data-tab="games">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/></svg></span><span>Games</span>
    </button>
    <button class="tab" data-tab="live">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M6 6.5c2.6 2.2 4 5.2 4.2 9"/><path d="M18 6.5c-2.6 2.2-4 5.2-4.2 9"/></svg></span><span>Live</span>
    </button>
    <button class="tab" data-tab="stats">
      <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 20v-7M12 20V6M17 20v-4"/></svg></span><span>Stats</span>
    </button>
  </nav>

  <div id="modalRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/players.js"></script>
  <script src="js/coaches.js"></script>
  <script src="js/checkin.js"></script>
  <script src="js/games.js"></script>
  <script src="js/live.js"></script>
  <script src="js/statsview.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
