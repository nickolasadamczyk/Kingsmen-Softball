<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Kingsmen Softball</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="brand-logo" />
      <div>
        <h1 id="teamName">Kingsmen Softball</h1>
        <p id="teamTagline" class="tagline">Slow-Pitch Team Manager</p>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings &amp; Backup" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="roster"><span class="tab-ico">👥</span><span>Roster</span></button>
    <button class="tab" data-tab="coaches"><span class="tab-ico">📋</span><span>Coaches</span></button>
    <button class="tab" data-tab="checkin"><span class="tab-ico">✅</span><span>Check-In</span></button>
    <button class="tab" data-tab="games"><span class="tab-ico">📅</span><span>Games</span></button>
    <button class="tab" data-tab="live"><span class="tab-ico">⚾</span><span>Live</span></button>
    <button class="tab" data-tab="stats"><span class="tab-ico">📊</span><span>Stats</span></button>
  </nav>

  <div id="modalRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/players.js"></script>
  <script src="js/coaches.js"></script>
  <script src="js/checkin.js"></script>
  <script src="js/games.js"></script>
  <script src="js/live.js"></script>
  <script src="js/statsview.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
